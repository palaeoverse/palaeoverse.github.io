<script>
// Quarto doesn't add an `active` class to the current page's navbar link in
// this setup, so do it ourselves: match each top-level navbar link's path
// against the current page and mark it.
document.addEventListener('DOMContentLoaded', function () {
  function norm(path) {
    path = path.replace(/index\.html$/, '');
    if (!path.endsWith('/')) path += '/';
    return path;
  }
  var current = norm(window.location.pathname);
  var links = document.querySelectorAll(
    '.navbar a.nav-link[href], .navbar a.dropdown-item[href]'
  );
  links.forEach(function (a) {
    // Never match dropdown toggles themselves: they use href="#", which
    // resolves to the current page (matching everywhere), and the href can be
    // rewritten at runtime — so exclude them by class. They get `active` only
    // via the parent-marking below, when one of their menu items is current.
    if (a.classList.contains('dropdown-toggle')) return;
    if (a.host !== window.location.host) return;
    if (norm(a.pathname) !== current) return;

    a.classList.add('active');
    // If this is a menu item, also light up its parent dropdown toggle.
    var dropdown = a.closest('.nav-item.dropdown');
    if (dropdown) {
      var toggle = dropdown.querySelector('.nav-link.dropdown-toggle');
      if (toggle) toggle.classList.add('active');
    }
  });
});
</script>
